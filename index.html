<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body style="margin:0; padding:0; background:transparent;">
  <div id="res" style="font-family:sans-serif; font-size:12px; color:#888;">AI Engine Loaded</div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/86305RftG/";
    let model;

    async function loadModel() {
      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        if (window.AppInventor) window.AppInventor.setWebViewString("READY");
      } catch (err) {
        if (window.AppInventor) window.AppInventor.setWebViewString("ERROR_LOADING_MODEL");
      }
    }

    async function analyzeImage(base64Data) {
      if (!model) {
        if (window.AppInventor) window.AppInventor.setWebViewString("Model is still loading, please wait...");
        return;
      }

      const img = new Image();
      img.src = base64Data;
      
      img.onload = async () => {
        try {
          const prediction = await model.predict(img);
          let top = prediction[0];
          for (let i = 1; i < prediction.length; i++) {
            if (prediction[i].probability > top.probability) {
              top = prediction[i];
            }
          }
          const percentage = Math.round(top.probability * 100);
          const resultText = top.className + " (" + percentage + "%)";

          if (window.AppInventor) {
            window.AppInventor.setWebViewString(resultText);
          }
        } catch (err) {
          if (window.AppInventor) window.AppInventor.setWebViewString("Analysis Error");
        }
      };
      
      img.onerror = () => {
        if (window.AppInventor) window.AppInventor.setWebViewString("Invalid Image Data");
      };
    }

    window.onload = loadModel;
  </script>
</body>
</html>
