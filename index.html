<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 10px; background: #fff; margin: 0; }
    #res { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 10px; }
    input { font-size: 14px; padding: 8px; }
  </style>
</head>
<body>
  <div id="res">Loading AI Model...</div>
  <input type="file" accept="image/*" onchange="processAndPredict(this)">

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/86305RftG/";
    let model;

    async function loadModel() {
      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        document.getElementById("res").innerText = "Model Ready! Select photo.";
      } catch (err) {
        document.getElementById("res").innerText = "Error loading model.";
      }
    }

    async function processAndPredict(input) {
      if (!input.files || !input.files[0]) return;
      if (!model) {
        document.getElementById("res").innerText = "Please wait, model still loading...";
        return;
      }

      document.getElementById("res").innerText = "Analyzing photo...";

      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const base64Image = e.target.result; // Complete base64 image data string

        const img = document.createElement('img');
        img.src = base64Image;
        
        img.onload = async () => {
          try {
            const prediction = await model.predict(img);
            let top = prediction[0];
            for (let i = 1; i < prediction.length; i++) {
              if (prediction[i].probability > top.probability) {
                top = prediction[i];
              }
            }
            const percentage = Math.round(top.probability * 100);
            const resultText = top.className + " (" + percentage + "%)";
            
            document.getElementById("res").innerText = resultText;

            // Send BOTH the result string and base64 image string separated by '|'
            if (window.AppInventor) {
              window.AppInventor.setWebViewString(resultText + "|" + base64Image);
            }
          } catch (err) {
            document.getElementById("res").innerText = "Analysis error.";
          }
        };
      };

      reader.readAsDataURL(file);
    }

    window.onload = loadModel;
  </script>
</body>
</html>
