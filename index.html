<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 15px; background: #fff; }
    #res { font-size: 18px; font-weight: bold; margin-top: 10px; color: #333; }
    input { font-size: 15px; padding: 8px; margin: 15px 0; }
  </style>
</head>
<body>
  <div id="res">Loading AI Model...</div>
  <input type="file" accept="image/*" onchange="predict(this)">

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/86305RftG/";
    let model;

    async function loadModel() {
      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        document.getElementById("res").innerText = "Model Ready! Select photo below.";
      } catch (err) {
        document.getElementById("res").innerText = "Error: " + err.message;
      }
    }

    async function predict(input) {
      if (!input.files || !input.files[0]) return;
      if (!model) {
        document.getElementById("res").innerText = "Please wait, model is still loading...";
        return;
      }

      document.getElementById("res").innerText = "Analyzing photo...";

      const img = document.createElement('img');
      img.src = URL.createObjectURL(input.files[0]);
      
      img.onload = async () => {
        try {
          const prediction = await model.predict(img);
          let top = prediction[0];
          for (let i = 1; i < prediction.length; i++) {
            if (prediction[i].probability > top.probability) {
              top = prediction[i];
            }
          }
          const percentage = Math.round(top.probability * 100);
          const finalResult = top.className + " (" + percentage + "%)";
          
          document.getElementById("res").innerText = finalResult;

          if (window.AppInventor) {
            window.AppInventor.setWebViewString(finalResult);
          }
        } catch (e) {
          document.getElementById("res").innerText = "Analysis error: " + e.message;
        }
      };
    }

    window.onload = loadModel;
  </script>
</body>
</html>
